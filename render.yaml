services:
  - type: web
    runtime: node
    name: sketch-studio
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WEB_CONCURRENCY
        value: "1"
      - key: IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: VISION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
